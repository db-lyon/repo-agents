# Reusable: review one pull request. See docs/architecture.md.
# Callers use pull_request_target, so fork PRs are reviewed too. The base
# branch is the project root (config, context, toolkit run from it); the PR
# head is checked out read-only into pr/ and never executed.
name: repo-agents review

on:
  workflow_call:
    inputs:
      number: { type: string, required: true }
      config: { type: string, default: .github/repo-agents.yml }
      toolkit_ref: { type: string, default: v1 }
    secrets:
      anthropic_api_key: { required: true }
      agents_token: { required: false }

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency: { group: "repo-agents-review-${{ inputs.number }}", cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
        with: { path: project, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { path: pr, ref: "refs/pull/${{ inputs.number }}/head", fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: db-lyon/repo-agents, ref: "${{ inputs.toolkit_ref }}", path: toolkit, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --omit=dev --prefix toolkit && npm install -g @anthropic-ai/claude-code@2.1.301
      - name: Decide
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          REPO_AGENTS_CONFIG: ${{ inputs.config }}
          NUMBER: ${{ inputs.number }}
        run: node ../toolkit/bin/repo-agents.mjs run review.decide --param "number=$NUMBER" --param "outdir=$RUNNER_TEMP/work"
      - uses: actions/upload-artifact@v4
        with: { name: "review-${{ inputs.number }}", path: "${{ runner.temp }}/work", if-no-files-found: ignore, retention-days: 30 }

  apply:
    needs: decide
    if: always() && needs.decide.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency: { group: "repo-agents-pr-${{ inputs.number }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { path: project, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: db-lyon/repo-agents, ref: "${{ inputs.toolkit_ref }}", path: toolkit, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --omit=dev --prefix toolkit
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "review-${{ inputs.number }}", path: "${{ runner.temp }}/work" }
      - name: Apply
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTS_TOKEN: ${{ secrets.agents_token }}
          REPO_AGENTS_CONFIG: ${{ inputs.config }}
          NUMBER: ${{ inputs.number }}
        run: node ../toolkit/bin/repo-agents.mjs run review.apply --param "number=$NUMBER" --param "outdir=$RUNNER_TEMP/work"
