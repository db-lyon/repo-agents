# Reusable: triage one issue. See docs/architecture.md.
name: repo-agents triage

on:
  workflow_call:
    inputs:
      number: { type: string, required: true }
      config: { type: string, default: .github/repo-agents.yml }
      toolkit_ref: { type: string, default: v1 }
      mode: { type: string, default: "", description: "Override settings.triage.mode" }
    secrets:
      anthropic_api_key: { required: true }
      agents_token: { required: false }

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { path: project, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: db-lyon/repo-agents, ref: "${{ inputs.toolkit_ref }}", path: toolkit, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --omit=dev --prefix toolkit && npm install -g @anthropic-ai/claude-code@2.1.301
      - name: Decide
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          REPO_AGENTS_CONFIG: ${{ inputs.config }}
          NUMBER: ${{ inputs.number }}
        run: node ../toolkit/bin/repo-agents.mjs run triage.decide --param "number=$NUMBER" --param "outdir=$RUNNER_TEMP/work"
      - uses: actions/upload-artifact@v4
        with: { name: "triage-${{ inputs.number }}", path: "${{ runner.temp }}/work", if-no-files-found: ignore, retention-days: 30 }

  apply:
    needs: decide
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    concurrency: { group: "repo-agents-issue-${{ inputs.number }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { path: project, fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@v4
        with: { repository: db-lyon/repo-agents, ref: "${{ inputs.toolkit_ref }}", path: toolkit, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --omit=dev --prefix toolkit
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: "triage-${{ inputs.number }}", path: "${{ runner.temp }}/work" }
      - name: Apply
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTS_TOKEN: ${{ secrets.agents_token }}
          REPO_AGENTS_CONFIG: ${{ inputs.config }}
          NUMBER: ${{ inputs.number }}
          MODE: ${{ inputs.mode }}
        run: |
          set -- --param "number=$NUMBER" --param "outdir=$RUNNER_TEMP/work"
          if [ -n "$MODE" ]; then set -- "$@" --param "mode=$MODE"; fi
          node ../toolkit/bin/repo-agents.mjs run triage.apply "$@"
