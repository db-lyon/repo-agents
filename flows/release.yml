# Release. release.plan and release.notes run in read-only jobs, release.gate
# on the project's gate runner, release.publish in the write job.
# Params: outdir (all), force (plan), version, prev_tag, default_branch.
# release.publish rolls back on failure: a draft it created is deleted again
# when a later step fails, since a stranded draft blocks every later plan.

tasks:
  shell: { class_path: shell, description: Run a shell command }
  claude_code: { class_path: claude_code, description: Run a headless Claude Code agent }
  release.facts: { class_path: release.facts, description: Gather the facts a release decision needs }
  release.plan: { class_path: release.plan, description: Decide whether and what to release }
  release.gates:
    class_path: release.gates
    description: Run the release gate commands
    options:
      commands: ${settings.release.gates}
  release.prepare_notes: { class_path: release.prepare_notes, description: Build the notes prompt and schema }
  release.check_notes: { class_path: release.check_notes, description: Validate the notes and write the release body }
  release.bump: { class_path: release.bump, description: Commit the version bump locally }
  release.draft: { class_path: release.draft, description: Create the draft release }
  release.delete: { class_path: release.delete, description: Delete a draft release }
  release.push: { class_path: release.push, description: Push the bump to the default branch }
  release.create: { class_path: release.create, description: Tag and publish the release }
  release.ci: { class_path: release.ci, description: Dispatch CI on the bump and report }

flows:
  release.plan:
    description: Find the previous tag, shippable commits, required workflows, drafts and the next version
    checks:
      - { when: "!${settings.release.enabled}", action: skip, message: release is disabled in settings }
    steps:
      10: { task: release.facts }
      20:
        task: release.plan
        options:
          facts: ${steps.10}

  release.gate:
    description: Run every release gate on the release commit
    checks:
      - { when: "!${settings.release.enabled}", action: skip, message: release is disabled in settings }
    steps:
      10: { task: release.gates }

  release.notes:
    description: Write the release notes with a read-only agent
    checks:
      - { when: "!${settings.release.enabled}", action: skip, message: release is disabled in settings }
    steps:
      10: { task: release.prepare_notes }
      20:
        task: claude_code
        when: ${steps.10.go}
        options:
          prompt_file: stages/release/prompt.md
          vars: ${steps.10.vars}
          schema: ${steps.10.schema}
          tools: [Read, Grep, Glob]
          model: ${settings.release.model}
          max_turns: ${settings.release.max_turns}
          max_budget_usd: ${settings.release.max_budget_usd}

  release.publish:
    description: Validate the notes, bump the version, and draft or publish the release
    rollback_on_failure: true
    checks:
      - { when: "!${settings.release.enabled}", action: skip, message: release is disabled in settings }
    steps:
      10: { task: release.check_notes }
      20:
        task: release.bump
        when: ${steps.10.go}
      30:
        task: release.draft
        when: ${steps.10.draft}
        options:
          tag: ${steps.10.tag}
          notes_file: ${steps.10.notes_file}
      40:
        task: release.push
        when: ${steps.10.go}
        options:
          branch: ${steps.10.branch}
      50:
        task: release.create
        when: ${steps.10.publish}
        options:
          tag: ${steps.10.tag}
          notes_file: ${steps.10.notes_file}
          sha: ${steps.20.sha}
      60:
        task: release.ci
        when: ${steps.10.go}
        options:
          tag: ${steps.10.tag}
          sha: ${steps.20.sha}
          branch: ${steps.10.branch}
          draft: ${steps.10.draft}
