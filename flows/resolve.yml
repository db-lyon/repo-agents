# Resolve. Params: number, outdir.
# resolve.decide runs in the read-only job; resolve.apply in the write job.
# resolve.apply rolls back on failure: a branch it pushed is deleted again when
# a later step fails, unless a PR is open on it.

tasks:
  claude_code: { class_path: claude_code, description: Run a headless Claude Code agent }
  issue.apply_plan: { class_path: issue.apply_plan, description: Apply planned writes to an issue }
  resolve.prepare: { class_path: resolve.prepare, description: "Build the resolve prompt, schema and commands" }
  resolve.setup:
    class_path: resolve.setup
    description: Run the setup commands and snapshot untracked files
    options:
      commands: ${settings.resolve.setup}
  resolve.capture: { class_path: resolve.capture, description: Write the agent's changes to fix.patch }
  resolve.check: { class_path: resolve.check, description: Read the decision and the patch }
  resolve.apply_patch: { class_path: resolve.apply_patch, description: Apply the patch on a fresh branch }
  resolve.verify:
    class_path: resolve.verify
    description: Run setup and verify on the patched tree
    options:
      setup: ${settings.resolve.setup}
      verify: ${settings.resolve.verify}
  resolve.plan: { class_path: resolve.plan, description: "Decide between a PR, a draft PR and a comment" }
  resolve.commit: { class_path: resolve.commit, description: Commit the fix locally }
  resolve.push: { class_path: resolve.push, description: Push the fix branch }
  resolve.delete_branch: { class_path: resolve.delete_branch, description: Delete a pushed branch with no open PR }
  resolve.open_pr: { class_path: resolve.open_pr, description: Open or update the PR }

flows:
  resolve.decide:
    description: Read the issue and the code, implement a fix, capture the diff
    checks:
      - { when: "!${settings.resolve.enabled}", action: skip, message: resolve is disabled in settings }
    steps:
      10: { task: resolve.prepare }
      20:
        task: resolve.setup
        when: ${steps.10.go}
      30:
        task: claude_code
        when: ${steps.20.go}
        ignore_failure: true
        options:
          prompt_file: stages/resolve/prompt.md
          vars: ${steps.10.vars}
          schema: ${steps.10.schema}
          tools: [Read, Grep, Glob, Edit, Write]
          commands: ${steps.10.commands}
          model: ${settings.resolve.model}
          max_turns: ${settings.resolve.max_turns}
          max_budget_usd: ${settings.resolve.max_budget_usd}
      40:
        task: resolve.capture
        when: ${steps.20.go}
        options:
          snapshot: ${steps.20.untracked}

  resolve.apply:
    description: Verify the fix and open a pull request, or explain on the issue
    rollback_on_failure: true
    checks:
      - { when: "!${settings.resolve.enabled}", action: skip, message: resolve is disabled in settings }
    steps:
      10: { task: resolve.check }
      20:
        task: resolve.apply_patch
        when: ${steps.10.go}
        options:
          patch: ${steps.10.patch}
      30:
        task: resolve.verify
        when: ${steps.20.applied}
      40:
        task: resolve.plan
        options:
          decision: ${steps.10.decision}
          issue: ${steps.10.issue}
          patch_files: ${steps.10.files}
          applied: ${steps.20.applied}
          staged_files: ${steps.20.files}
          patch_error: ${steps.20.error}
          verify_results: ${steps.30.results}
      50:
        task: issue.apply_plan
        when: ${steps.40.comment}
        options:
          stage: resolve
          plan: ${steps.40.issue_plan}
      60:
        task: resolve.commit
        when: ${steps.40.pr}
        options:
          publish: ${steps.40.publish}
      70:
        task: resolve.push
        when: ${steps.40.pr}
        options:
          publish: ${steps.40.publish}
      80:
        task: resolve.open_pr
        when: ${steps.40.pr}
        options:
          publish: ${steps.40.publish}
      90:
        task: issue.apply_plan
        when: ${steps.40.pr}
        options:
          stage: resolve
          plan: ${steps.80.issue_plan}
