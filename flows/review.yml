# Review. Params: number, outdir.
# review.decide runs in the read-only job with the base checkout as the
# project root and the PR head in ../pr; review.apply runs in the write job.

tasks:
  claude_code: { class_path: claude_code, description: Run a headless Claude Code agent }
  review.prepare: { class_path: review.prepare, description: Decide whether to review and build the prompt }
  review.facts: { class_path: review.facts, description: "Read the decision, the live PR and its diff" }
  review.plan: { class_path: review.plan, description: Plan the review and the merge }
  review.post: { class_path: review.post, description: Post the review }
  review.merge:
    class_path: review.merge
    description: Merge an approved PR
    options:
      method: ${settings.review.merge_method}

flows:
  review.decide:
    description: Read the PR, its diff, checks and code, decide
    checks:
      - { when: "!${settings.review.enabled}", action: skip, message: review is disabled in settings }
    steps:
      10: { task: review.prepare }
      20:
        task: claude_code
        when: ${steps.10.go}
        ignore_failure: true
        options:
          prompt_file: stages/review/prompt.md
          vars: ${steps.10.vars}
          schema: ${steps.10.schema}
          cwd: ../pr
          tools: [Read, Grep, Glob]
          model: ${settings.review.model}
          max_turns: ${settings.review.max_turns}
          max_budget_usd: ${settings.review.max_budget_usd}

  review.apply:
    description: Verify the decision, post the review, merge when allowed
    checks:
      - { when: "!${settings.review.enabled}", action: skip, message: review is disabled in settings }
    steps:
      10: { task: review.facts }
      20:
        task: review.plan
        when: ${steps.10.go}
        options:
          agent: ${steps.10.agent}
          pr: ${steps.10.pr}
          diff: ${steps.10.diff}
          reviewed_sha: ${steps.10.reviewed_sha}
      30:
        task: review.post
        when: ${steps.20.post}
        options:
          plan: ${steps.20.plan}
          sha: ${steps.20.sha}
          confidence: ${steps.20.confidence}
      40:
        task: review.merge
        when: ${steps.20.merge}
        options:
          sha: ${steps.20.sha}
          pr: ${steps.10.pr}
          confidence: ${steps.20.confidence}
